<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div class="admin-sidebar p-3" style="width:230px;">
    <div class="d-flex align-items-center gap-2 mb-4">
      <img src="/img/logo.svg" width="42" height="42" alt="LATK" />
      <strong>LATK Admin</strong>
    </div>
    <a href="dashboard.html" class="active">📊 Dashboard</a>
    <a href="accounts.html">👥 Accounts</a>
    <a href="inventory.html">📦 Inventory</a>
    <a href="orders.html">🧾 Orders</a>
    <a href="reports.html">📈 Reports</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>

  <div class="flex-grow-1 p-4">
    <h3 class="fw-bold mb-4">Dashboard Overview</h3>
    <div class="row g-3 mb-4" id="statCards"></div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card stat-card p-3">
          <h6 class="fw-bold">Low Stock Alerts</h6>
          <div id="lowStockList"><p class="text-muted small">Loading...</p></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card stat-card p-3">
          <h6 class="fw-bold">Recent Orders</h6>
          <div id="recentOrders"><p class="text-muted small">Loading...</p></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
requireAdminAuth();
const user = getUser();

async function load() {
  const report = await api("/admin/reports");
  document.getElementById("statCards").innerHTML = `
    <div class="col-md-3"><div class="card stat-card p-3"><div class="small text-muted">Total Revenue</div><div class="fs-4 fw-bold">${peso(report.totalRevenue)}</div></div></div>
    <div class="col-md-3"><div class="card stat-card p-3"><div class="small text-muted">Total Orders</div><div class="fs-4 fw-bold">${report.totalOrders}</div></div></div>
    <div class="col-md-3"><div class="card stat-card p-3"><div class="small text-muted">Customers</div><div class="fs-4 fw-bold">${report.totalCustomers}</div></div></div>
    <div class="col-md-3"><div class="card stat-card p-3"><div class="small text-muted">Low Stock Items</div><div class="fs-4 fw-bold text-danger">${report.lowStock.length}</div></div></div>
  `;

  document.getElementById("lowStockList").innerHTML = report.lowStock.length
    ? report.lowStock.map(p => `<div class="d-flex justify-content-between border-bottom py-1"><span>${p.name}</span><span class="text-danger">${p.stock} left</span></div>`).join("")
    : `<p class="text-muted small mb-0">All items are sufficiently stocked.</p>`;

  const { orders } = await api("/admin/orders");
  const recent = orders.slice(0, 6);
  document.getElementById("recentOrders").innerHTML = recent.length
    ? recent.map(o => `<div class="d-flex justify-content-between border-bottom py-1"><span>#${o._id.slice(-6).toUpperCase()} - ${o.user ? o.user.firstName : "?"}</span><span class="status-badge status-${o.status.replace(/\s/g,'-')}">${o.status}</span></div>`).join("")
    : `<p class="text-muted small mb-0">No orders yet.</p>`;
}
load();
</script>
</body>
</html>
