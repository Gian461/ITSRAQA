<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accounts - LATK Admin</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div class="admin-sidebar p-3" style="width:230px;">
    <div class="d-flex align-items-center gap-2 mb-4">
      <img src="/img/logo.svg" width="42" height="42" alt="LATK" />
      <strong>LATK Admin</strong>
    </div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="accounts.html" class="active">👥 Accounts</a>
    <a href="inventory.html">📦 Inventory</a>
    <a href="orders.html">🧾 Orders</a>
    <a href="reports.html">📈 Reports</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>

  <div class="flex-grow-1 p-4">
    <h3 class="fw-bold mb-4">Registered Accounts</h3>
    <div class="card stat-card p-3">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr><th>Name</th><th>Username</th><th>Email</th><th>Home Address</th><th>Role</th><th>Joined</th></tr>
        </thead>
        <tbody id="usersTable"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
requireAdminAuth();
async function load() {
  const { users } = await api("/admin/users");
  document.getElementById("usersTable").innerHTML = users
    .map(
      (u) => `
    <tr>
      <td>${u.firstName} ${u.lastName}</td>
      <td>${u.username}</td>
      <td>${u.email}</td>
      <td>${u.homeAddress || "-"}</td>
      <td>${u.isAdmin ? '<span class="badge bg-danger">Admin</span>' : '<span class="badge bg-secondary">Customer</span>'}</td>
      <td>${new Date(u.createdAt).toLocaleDateString()}</td>
    </tr>`
    )
    .join("");
}
load();
</script>
</body>
</html>
