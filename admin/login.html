<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login - LATK Cafe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:linear-gradient(160deg, var(--latk-maroon) 0%, #2a0508 100%);">
  <div class="card p-5 shadow" style="width:420px;">
    <div class="text-center mb-3">
      <img src="/img/logo.svg" width="80" height="80" alt="LATK" />
      <h4 class="fw-bold mt-2">LATK Admin Panel</h4>
    </div>
    <div id="errorBox" class="alert alert-danger d-none"></div>
    <form id="adminLoginForm">
      <label class="form-label small fw-bold">USERNAME</label>
      <input type="text" id="username" class="form-control form-control-latk mb-3" required />
      <label class="form-label small fw-bold">PASSWORD</label>
      <input type="password" id="password" class="form-control form-control-latk mb-4" required />
      <button type="submit" class="btn btn-maroon w-100 py-2">LOGIN AS ADMIN</button>
    </form>
    <div class="text-center mt-3">
      <a href="/login.html" class="small text-muted">Back to customer login</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("d-none");
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      },
    });
    if (!data.user.isAdmin) {
      errorBox.textContent = "This account does not have admin access.";
      errorBox.classList.remove("d-none");
      return;
    }
    saveSession(data.token, data.user);
    window.location.href = "/admin/dashboard.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  }
});
</script>
</body>
</html>
