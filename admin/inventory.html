<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory - LATK Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div class="admin-sidebar p-3" style="width:230px;">
    <div class="d-flex align-items-center gap-2 mb-4">
      <img src="/img/logo.svg" width="42" height="42" alt="LATK" />
      <strong>LATK Admin</strong>
    </div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="accounts.html">👥 Accounts</a>
    <a href="inventory.html" class="active">📦 Inventory</a>
    <a href="orders.html">🧾 Orders</a>
    <a href="reports.html">📈 Reports</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>

  <div class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold mb-0">Inventory Database</h3>
      <button class="btn btn-maroon" data-bs-toggle="modal" data-bs-target="#addProductModal">+ Add Product</button>
    </div>

    <div id="alertBox" class="alert d-none"></div>

    <div class="card stat-card p-3">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr><th>Product</th><th>Type</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Replenish</th></tr>
        </thead>
        <tbody id="inventoryTable"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add product modal -->
<div class="modal fade" id="addProductModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addProductForm">
        <div class="modal-header">
          <h5 class="modal-title">Add New Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input class="form-control mb-2" id="pName" placeholder="Product name" required />
          <textarea class="form-control mb-2" id="pDesc" placeholder="Description"></textarea>
          <select class="form-select mb-2" id="pType" required>
            <option value="food">Food</option>
            <option value="drinks">Drinks</option>
          </select>
          <select class="form-select mb-2" id="pSub" required>
            <option>Grilled</option><option>Steak</option><option>Fried</option>
          </select>
          <input type="number" class="form-control mb-2" id="pPrice" placeholder="Price" min="0" required />
          <input type="number" class="form-control mb-2" id="pStock" placeholder="Initial stock" min="0" required />
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-maroon">Add Product</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
requireAdminAuth();

const SUBS = {
  food: ["Grilled", "Steak", "Fried"],
  drinks: ["Coffee-Based", "Frappuccino", "Matcha"],
};
document.getElementById("pType").addEventListener("change", (e) => {
  const sub = document.getElementById("pSub");
  sub.innerHTML = SUBS[e.target.value].map((s) => `<option>${s}</option>`).join("");
});

function showAlert(msg, type = "success") {
  const box = document.getElementById("alertBox");
  box.className = `alert alert-${type}`;
  box.textContent = msg;
  setTimeout(() => box.classList.add("d-none"), 3000);
}

async function loadInventory() {
  const { products } = await api("/admin/inventory");
  document.getElementById("inventoryTable").innerHTML = products
    .map(
      (p) => `
    <tr>
      <td>${p.name}</td>
      <td class="text-capitalize">${p.type}</td>
      <td>${p.subcategory}</td>
      <td>${peso(p.price)}</td>
      <td>${p.stock}</td>
      <td>${p.stock <= p.lowStockThreshold ? '<span class="badge bg-danger">Low Stock</span>' : '<span class="badge bg-success">OK</span>'}</td>
      <td>
        <div class="input-group input-group-sm" style="width:150px;">
          <input type="number" min="1" class="form-control" id="qty-${p._id}" placeholder="Qty" />
          <button class="btn btn-orange btn-sm" onclick="restock('${p._id}')">Restock</button>
        </div>
      </td>
    </tr>`
    )
    .join("");
}

async function restock(id) {
  const input = document.getElementById(`qty-${id}`);
  const qty = Number(input.value);
  if (!qty || qty <= 0) return showAlert("Enter a valid quantity to replenish.", "danger");
  try {
    await api(`/admin/inventory/${id}/restock`, { method: "POST", body: { qty } });
    showAlert(`Stock replenished by ${qty}.`);
    input.value = "";
    loadInventory();
  } catch (err) {
    showAlert(err.message, "danger");
  }
}

document.getElementById("addProductForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("/admin/inventory", {
      method: "POST",
      body: {
        name: document.getElementById("pName").value.trim(),
        description: document.getElementById("pDesc").value.trim(),
        type: document.getElementById("pType").value,
        subcategory: document.getElementById("pSub").value,
        price: Number(document.getElementById("pPrice").value),
        stock: Number(document.getElementById("pStock").value),
      },
    });
    bootstrap.Modal.getInstance(document.getElementById("addProductModal")).hide();
    e.target.reset();
    showAlert("Product added successfully.");
    loadInventory();
  } catch (err) {
    showAlert(err.message, "danger");
  }
});

loadInventory();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
