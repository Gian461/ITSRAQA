<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us - LATK Cafe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white px-4 shadow-sm">
  <a class="navbar-brand d-flex align-items-center gap-2" href="home.html">
    <img src="img/logo.svg" width="42" height="42" alt="LATK" />
    <span class="fw-bold" style="color:var(--latk-maroon)">Lolo<br>and The Kids</span>
  </a>
</nav>

<div class="row g-0" style="min-height: calc(100vh - 76px);">
  <div class="col-md-5 d-flex flex-column justify-content-center p-5 text-white" style="background:var(--latk-maroon);">
    <h1 class="fw-bold">Contact Us</h1>
    <p>Need to get in touch with us? Fill out the form with your inquiry or find the
      <a href="mailto:hello@latkcafe.com" class="text-white text-decoration-underline">cafe email</a> you'd like to contact below.</p>
  </div>
  <div class="col-md-7 d-flex align-items-center p-5">
    <form id="contactForm" class="w-100">
      <div id="successBox" class="alert alert-success d-none">Thanks! Your message has been sent.</div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <input type="text" class="form-control form-control-latk" placeholder="First Name*" id="cFirst" required />
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control form-control-latk" placeholder="Last Name*" id="cLast" required />
        </div>
      </div>
      <input type="email" class="form-control form-control-latk mb-3" placeholder="Email*" id="cEmail" required />
      <textarea class="form-control form-control-latk mb-3" rows="6" placeholder="What can we help you with?" id="cMessage" required></textarea>
      <div class="d-flex gap-3">
        <a href="menu.html" class="btn btn-maroon">Dashboard</a>
        <button type="submit" class="btn btn-orange">Submit</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
requireAuth();
document.getElementById("contactForm").addEventListener("submit", (e) => {
  e.preventDefault();
  // Demo only - no backend endpoint for contact messages yet.
  document.getElementById("successBox").classList.remove("d-none");
  e.target.reset();
});
</script>
</body>
</html>
