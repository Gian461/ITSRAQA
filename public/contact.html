<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div id="navbar"></div>

<div class="row g-0 flex-grow-1" style="min-height: calc(100vh - 76px);">
  <div class="col-md-5 d-flex flex-column justify-content-center p-5 text-white" style="background:var(--latk-maroon);">
    <h1 class="fw-bold display-5 mb-3">Contact Us</h1>
    <p class="fs-5 opacity-90 leading-relaxed">
      Need to get in touch with us? Fill out the form with your inquiry or find the
      <a href="mailto:hello@latkcafe.com" class="text-white text-decoration-underline">cafe email</a> you'd like to contact below.
    </p>
  </div>
  <div class="col-md-7 d-flex align-items-center p-5">
    <form id="contactForm" class="w-100" style="max-width: 580px;">
      <div id="successBox" class="alert alert-success d-none">Thanks! Your message has been sent.</div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <input type="text" class="form-control form-control-latk" placeholder="First Name*" id="cFirst" required />
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control form-control-latk" placeholder="Last Name*" id="cLast" required />
        </div>
      </div>
      <input type="email" class="form-control form-control-latk mb-3" placeholder="Email*" id="cEmail" required />
      <textarea class="form-control form-control-latk mb-4" rows="5" placeholder="What can we help you with?" id="cMessage" required></textarea>
      <div class="d-flex gap-3">
        <a href="menu.html" class="btn btn-maroon px-4 py-2">View Menu</a>
        <button type="submit" class="btn btn-orange px-4 py-2">Submit</button>
      </div>
    </form>
  </div>
</div>

<div id="footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script>
requireAuth();
renderNavbar("contact");
renderFooter();

document.getElementById("contactForm").addEventListener("submit", (e) => {
  e.preventDefault();
  document.getElementById("successBox").classList.remove("d-none");
  e.target.reset();
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
