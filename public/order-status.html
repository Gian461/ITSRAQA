<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders & Tracker - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div id="navbar"></div>

<div class="container my-5 flex-grow-1" style="max-width:980px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1" style="color: var(--latk-maroon);">My Orders</h2>
      <p class="text-secondary small mb-0">Track your current food orders & view your order history</p>
    </div>
    <a href="menu.html" class="btn btn-orange btn-sm px-4 py-2">+ Place New Order</a>
  </div>

  <!-- Filter Pills -->
  <div class="card p-3 mb-4 border-0 shadow-sm rounded-4">
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-dark rounded-pill px-4 order-filter active" data-filter="all">All Orders</button>
      <button class="btn btn-sm btn-outline-dark rounded-pill px-4 order-filter" data-filter="active">Active Orders</button>
      <button class="btn btn-sm btn-outline-dark rounded-pill px-4 order-filter" data-filter="delivered">Delivered</button>
    </div>
  </div>

  <div id="ordersList"></div>
</div>

<div id="footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script>
requireAuth();
renderNavbar("orders");
renderFooter();

let myOrders = [];
let currentFilter = "all";

const STATUS_STEPS = ["Pending", "Preparing", "Out for Delivery", "Delivered"];

function getStepIndex(status) {
  const idx = STATUS_STEPS.indexOf(status);
  return idx >= 0 ? idx : 0;
}

function renderProgressBar(status) {
  if (status === "Cancelled") {
    return `<div class="alert alert-danger py-2 px-3 small mb-3 border-0">❌ This order was cancelled.</div>`;
  }

  const currentIdx = getStepIndex(status);

  return `
    <div class="my-3 py-2 px-3 bg-light rounded-3">
      <div class="d-flex justify-content-between align-items-center position-relative mb-2">
        ${STATUS_STEPS.map((step, idx) => {
          const isDone = idx <= currentIdx;
          const isCurrent = idx === currentIdx;
          return `
            <div class="text-center z-1">
              <div class="mx-auto rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm ${isDone ? 'bg-success text-white' : 'bg-white text-muted border'}" style="width:32px;height:32px; font-size:0.8rem;">
                ${isDone ? '✓' : idx + 1}
              </div>
              <span class="small d-block mt-1 ${isCurrent ? 'fw-bold text-success' : 'text-muted'}" style="font-size:0.75rem;">${step}</span>
            </div>`;
        }).join("")}
      </div>
    </div>`;
}

async function loadOrders() {
  const list = document.getElementById("ordersList");
  try {
    const { orders } = await api("/orders/mine");
    myOrders = orders || [];
    renderOrders();
  } catch (err) {
    list.innerHTML = `<div class="alert alert-danger shadow-sm border-0">${err.message}</div>`;
  }
}

function renderOrders() {
  const list = document.getElementById("ordersList");
  let filtered = myOrders;

  if (currentFilter === "active") {
    filtered = myOrders.filter(o => o.status !== "Delivered" && o.status !== "Cancelled");
  } else if (currentFilter === "delivered") {
    filtered = myOrders.filter(o => o.status === "Delivered");
  }

  if (!filtered.length) {
    list.innerHTML = `
      <div class="card p-5 text-center border-0 shadow-sm rounded-4 my-4">
        <div class="fs-1 mb-2">🍱</div>
        <h5>No orders found</h5>
        <p class="text-muted small mb-3">You don't have any ${currentFilter !== 'all' ? currentFilter : ''} orders yet.</p>
        <div><a href="menu.html" class="btn btn-orange px-4 py-2">Explore Our Menu</a></div>
      </div>`;
    return;
  }

  list.innerHTML = filtered
    .map(
      (o) => `
    <div class="card mb-4 shadow-sm border-0 rounded-4 overflow-hidden">
      <div class="card-header bg-white p-4 border-bottom d-flex justify-content-between align-items-center">
        <div>
          <strong class="fs-5 text-dark">Order #${o._id.slice(-6).toUpperCase()}</strong>
          <span class="small text-muted d-block">${new Date(o.createdAt).toLocaleString()}</span>
        </div>
        <span class="status-badge status-${o.status.replace(/\s/g, "-")} px-3 py-1 fs-7">${o.status}</span>
      </div>

      <div class="card-body p-4">
        ${renderProgressBar(o.status)}

        <div class="table-responsive mb-3">
          <table class="table table-borderless align-middle mb-0 small">
            <tbody class="border-top border-bottom">
              ${o.items.map(i => `
                <tr>
                  <td class="fw-semibold text-dark">${i.name}</td>
                  <td class="text-muted">Qty: ${i.qty}</td>
                  <td class="text-end fw-bold text-dark">${peso(i.price * i.qty)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>

        <div class="row g-3 align-items-center pt-2">
          <div class="col-md-7">
            <div class="small text-muted">
              <span>📍 <strong>Deliver to:</strong> ${o.deliveryAddress ? `${o.deliveryAddress.firstName} ${o.deliveryAddress.lastName}, ${o.deliveryAddress.address}, ${o.deliveryAddress.barangay}, ${o.deliveryAddress.city}` : 'Standard Address'}</span>
            </div>
            <div class="small text-muted mt-1">
              <span>💳 <strong>Payment:</strong> <span class="badge bg-light text-dark border">${o.paymentMethod}</span></span>
            </div>
          </div>
          <div class="col-md-5 text-end">
            <span class="text-muted small me-2">Total Amount:</span>
            <strong class="fs-4 text-warning fw-bold" style="color:var(--latk-orange) !important;">${peso(o.total)}</strong>
          </div>
        </div>
      </div>
    </div>`
    )
    .join("");
}

document.querySelectorAll(".order-filter").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".order-filter").forEach(b => {
      b.classList.remove("active", "btn-dark");
      b.classList.add("btn-outline-dark");
    });
    btn.classList.add("active", "btn-dark");
    btn.classList.remove("btn-outline-dark");
    currentFilter = btn.dataset.filter;
    renderOrders();
  });
});

loadOrders();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
