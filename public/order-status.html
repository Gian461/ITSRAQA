<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders - LATK Cafe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-latk px-4">
  <a class="navbar-brand" href="home.html"><img src="img/logo.svg" width="42" height="42" alt="LATK" /></a>
  <div class="ms-auto d-flex align-items-center gap-4">
    <a href="menu.html" class="text-white text-decoration-none">Menu</a>
    <span class="text-white">User: <strong id="navUserName"></strong></span>
    <a href="#" class="text-white text-decoration-none" onclick="logout()">Logout</a>
  </div>
</nav>

<div class="container my-5">
  <h2 class="fw-bold mb-4">My Orders</h2>
  <div id="ordersList"></div>
</div>

<script src="js/api.js"></script>
<script>
requireAuth();
const user = getUser();
if (user) document.getElementById("navUserName").textContent = user.firstName || user.username;

async function loadOrders() {
  const list = document.getElementById("ordersList");
  try {
    const { orders } = await api("/orders/mine");
    if (!orders.length) {
      list.innerHTML = `<p class="text-muted">You haven't placed any orders yet. <a href="menu.html">Browse the menu</a>.</p>`;
      return;
    }
    list.innerHTML = orders
      .map(
        (o) => `
      <div class="card mb-3 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>Order #${o._id.slice(-6).toUpperCase()}</strong>
            <span class="status-badge status-${o.status.replace(/\s/g, "-")}">${o.status}</span>
          </div>
          <p class="small text-muted mb-2">${new Date(o.createdAt).toLocaleString()}</p>
          <p class="mb-2">${o.items.map((i) => `${i.name} x${i.qty}`).join(", ")}</p>
          <div class="d-flex justify-content-between">
            <span>${o.paymentMethod}</span>
            <strong>${peso(o.total)}</strong>
          </div>
        </div>
      </div>`
      )
      .join("");
  } catch (err) {
    list.innerHTML = `<p class="text-danger">${err.message}</p>`;
  }
}
loadOrders();
</script>
</body>
</html>
