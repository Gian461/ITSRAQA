<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div id="navbar"></div>

<div class="container my-5 flex-grow-1" style="max-width:900px;">
  <h2 class="fw-bold mb-4">My Orders</h2>
  <div id="ordersList"></div>
</div>

<div id="footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script>
requireAuth();
renderNavbar("orders");
renderFooter();

async function loadOrders() {
  const list = document.getElementById("ordersList");
  try {
    const { orders } = await api("/orders/mine");
    if (!orders.length) {
      list.innerHTML = `<p class="text-muted">You haven't placed any orders yet. <a href="menu.html">Browse the menu</a>.</p>`;
      return;
    }
    list.innerHTML = orders
      .map(
        (o) => `
      <div class="card mb-3 shadow-sm border-0 stat-card">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>Order #${o._id.slice(-6).toUpperCase()}</strong>
            <span class="status-badge status-${o.status.replace(/\s/g, "-")}">${o.status}</span>
          </div>
          <p class="small text-muted mb-2">${new Date(o.createdAt).toLocaleString()}</p>
          <p class="mb-2 fw-semibold">${o.items.map((i) => `${i.name} x${i.qty}`).join(", ")}</p>
          <div class="d-flex justify-content-between pt-2 border-top">
            <span class="text-muted small">${o.paymentMethod}</span>
            <strong class="fs-5">${peso(o.total)}</strong>
          </div>
        </div>
      </div>`
      )
      .join("");
  } catch (err) {
    list.innerHTML = `<p class="text-danger">${err.message}</p>`;
  }
}
loadOrders();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
