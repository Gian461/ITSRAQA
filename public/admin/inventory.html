<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory Management - LATK Admin</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex min-vh-100">
  <div id="adminSidebar"></div>

  <div class="flex-grow-1 p-4 overflow-auto">
    <!-- Header Title Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1" style="color: var(--latk-maroon);">Inventory Database</h3>
        <p class="text-muted small mb-0">Manage catalog items, pricing, and stock replenishment</p>
      </div>
      <button class="btn btn-maroon px-4 py-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#addProductModal">+ Add New Product</button>
    </div>

    <div id="alertBox" class="alert d-none"></div>

    <!-- Filter & Search Bar -->
    <div class="card p-3 mb-4 border-0 shadow-sm rounded-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-6 d-flex gap-2">
          <button class="btn btn-sm btn-dark rounded-pill px-3 type-filter-btn active" data-type="all">All Types</button>
          <button class="btn btn-sm btn-outline-dark rounded-pill px-3 type-filter-btn" data-type="food">🍔 Food</button>
          <button class="btn btn-sm btn-outline-dark rounded-pill px-3 type-filter-btn" data-type="drinks">☕ Drinks</button>
        </div>
        <div class="col-md-6">
          <input type="text" id="invSearchInput" class="form-control form-control-sm rounded-pill px-3" placeholder="🔍 Search product catalog..." />
        </div>
      </div>
    </div>

    <!-- Inventory Table Card -->
    <div class="card stat-card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th class="ps-4">PRODUCT NAME</th>
              <th>TYPE</th>
              <th>SUBCATEGORY</th>
              <th>PRICE</th>
              <th>STOCK LEVEL</th>
              <th>STATUS</th>
              <th class="pe-4">REPLENISH STOCK</th>
            </tr>
          </thead>
          <tbody id="inventoryTable">
            <tr><td colspan="7" class="text-muted text-center py-4">Loading inventory database...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Product Modal -->
<div class="modal fade" id="addProductModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <form id="addProductForm">
        <div class="modal-header bg-dark text-white rounded-top-4">
          <h5 class="modal-title fw-bold">Add New Product</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="mb-3 text-start">
            <label class="form-label small fw-bold">PRODUCT NAME</label>
            <input class="form-control form-control-latk" id="pName" placeholder="e.g. Grilled Chicken Steak" required />
          </div>

          <div class="mb-3 text-start">
            <label class="form-label small fw-bold">DESCRIPTION</label>
            <textarea class="form-control form-control-latk" id="pDesc" rows="2" placeholder="Brief description of the item"></textarea>
          </div>

          <div class="row g-2 mb-3 text-start">
            <div class="col-md-6">
              <label class="form-label small fw-bold">TYPE</label>
              <select class="form-select form-control-latk" id="pType" required>
                <option value="food">Food</option>
                <option value="drinks">Drinks</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">SUBCATEGORY</label>
              <select class="form-select form-control-latk" id="pSub" required>
                <option>Grilled</option><option>Steak</option><option>Fried</option><option>Pansit</option><option>Pasta</option><option>Sandwiches</option><option>Pastries &amp; Desserts</option>
              </select>
            </div>
          </div>

          <div class="row g-2 text-start">
            <div class="col-md-6">
              <label class="form-label small fw-bold">PRICE (₱)</label>
              <input type="number" class="form-control form-control-latk" id="pPrice" placeholder="150" min="0" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">INITIAL STOCK</label>
              <input type="number" class="form-control form-control-latk" id="pStock" placeholder="50" min="0" required />
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-maroon rounded-pill px-4">Add Product</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/admin/admin-components.js"></script>
<script>
requireAdminAuth();
renderAdminSidebar("inventory");

const SUBS = {
  food: ["Grilled", "Steak", "Fried", "Pansit", "Pasta", "Sandwiches", "Pastries & Desserts"],
  drinks: ["Coffee-Based", "Frappuccino", "Matcha", "Mocktails"],
};
let allProducts = [];
let activeTypeFilter = "all";
let invSearchQuery = "";

document.getElementById("pType").addEventListener("change", (e) => {
  const sub = document.getElementById("pSub");
  sub.innerHTML = SUBS[e.target.value].map((s) => `<option>${s}</option>`).join("");
});

function showAlert(msg, type = "success") {
  const box = document.getElementById("alertBox");
  box.className = `alert alert-${type} shadow-sm border-0 mb-3`;
  box.textContent = msg;
  box.classList.remove("d-none");
  setTimeout(() => box.classList.add("d-none"), 3000);
}

async function loadInventory() {
  try {
    const data = await api("/admin/inventory");
    allProducts = data.products || [];
    renderInventoryTable();
  } catch (err) {
    showAlert(err.message, "danger");
  }
}

function renderInventoryTable() {
  const tbody = document.getElementById("inventoryTable");
  let filtered = allProducts;

  if (activeTypeFilter !== "all") {
    filtered = filtered.filter(p => p.type === activeTypeFilter);
  }

  if (invSearchQuery.trim()) {
    const q = invSearchQuery.toLowerCase();
    filtered = filtered.filter(p => p.name.toLowerCase().includes(q) || p.subcategory.toLowerCase().includes(q));
  }

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-5">No products found matching filters.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered
    .map(
      (p) => {
        const isLow = p.stock <= (p.lowStockThreshold || 5);
        return `
    <tr>
      <td class="ps-4 fw-bold">
        <div class="text-dark">${p.name}</div>
        <div class="small text-muted" style="max-width:200px;">${p.description || ''}</div>
      </td>
      <td class="text-capitalize"><span class="badge ${p.type==='food'?'bg-maroon':'bg-dark'}">${p.type}</span></td>
      <td><span class="badge bg-light text-dark border">${p.subcategory}</span></td>
      <td class="fw-bold">${peso(p.price)}</td>
      <td><strong class="${isLow ? 'text-danger fs-6' : 'text-dark'}">${p.stock}</strong></td>
      <td>${isLow ? '<span class="badge bg-danger rounded-pill px-3 py-1">Low Stock</span>' : '<span class="badge bg-success rounded-pill px-3 py-1">In Stock</span>'}</td>
      <td class="pe-4">
        <div class="input-group input-group-sm" style="width:160px;">
          <input type="number" min="1" class="form-control rounded-start-pill" id="qty-${p._id}" placeholder="Qty" />
          <button class="btn btn-orange btn-sm rounded-end-pill px-3" onclick="restock('${p._id}')">+ Add</button>
        </div>
      </td>
    </tr>`;
      }
    )
    .join("");
}

async function restock(id) {
  const input = document.getElementById(`qty-${id}`);
  const qty = Number(input.value);
  if (!qty || qty <= 0) return showAlert("Enter a valid quantity to replenish.", "danger");
  try {
    await api(`/admin/inventory/${id}/restock`, { method: "POST", body: { qty } });
    showAlert(`Stock replenished by +${qty} items.`);
    input.value = "";
    loadInventory();
  } catch (err) {
    showAlert(err.message, "danger");
  }
}

document.getElementById("addProductForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("/admin/inventory", {
      method: "POST",
      body: {
        name: document.getElementById("pName").value.trim(),
        description: document.getElementById("pDesc").value.trim(),
        type: document.getElementById("pType").value,
        subcategory: document.getElementById("pSub").value,
        price: Number(document.getElementById("pPrice").value),
        stock: Number(document.getElementById("pStock").value),
      },
    });
    bootstrap.Modal.getInstance(document.getElementById("addProductModal")).hide();
    e.target.reset();
    showAlert("New product added to catalog successfully.");
    loadInventory();
  } catch (err) {
    showAlert(err.message, "danger");
  }
});

// Filter & Search Listeners
document.querySelectorAll(".type-filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".type-filter-btn").forEach(b => {
      b.classList.remove("active", "btn-dark");
      b.classList.add("btn-outline-dark");
    });
    btn.classList.add("active", "btn-dark");
    btn.classList.remove("btn-outline-dark");
    activeTypeFilter = btn.dataset.type;
    renderInventoryTable();
  });
});

document.getElementById("invSearchInput").addEventListener("input", (e) => {
  invSearchQuery = e.target.value;
  renderInventoryTable();
});

loadInventory();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
