<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Accounts Management - LATK Admin</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex min-vh-100">
  <div id="adminSidebar"></div>

  <div class="flex-grow-1 p-4 overflow-auto">
    <!-- Header Title Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1" style="color: var(--latk-maroon);">User Accounts Roster</h3>
        <p class="text-muted small mb-0">View registered customer accounts and administrator privileges</p>
      </div>
    </div>

    <div id="alertBox" class="alert d-none"></div>

    <!-- Filter & Search Bar -->
    <div class="card p-3 mb-4 border-0 shadow-sm rounded-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-6 d-flex gap-2">
          <button class="btn btn-sm btn-dark rounded-pill px-3 role-filter-btn active" data-role="all">All Users</button>
          <button class="btn btn-sm btn-outline-dark rounded-pill px-3 role-filter-btn" data-role="customer">Customers Only</button>
          <button class="btn btn-sm btn-outline-dark rounded-pill px-3 role-filter-btn" data-role="admin">Admins Only</button>
        </div>
        <div class="col-md-6">
          <input type="text" id="accSearchInput" class="form-control form-control-sm rounded-pill px-3" placeholder="🔍 Search accounts by name, username, or email..." />
        </div>
      </div>
    </div>

    <!-- Accounts Table Card -->
    <div class="card stat-card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th class="ps-4">FULL NAME</th>
              <th>USERNAME</th>
              <th>EMAIL ADDRESS</th>
              <th>HOME ADDRESS</th>
              <th>SYSTEM ROLE</th>
              <th class="pe-4">JOINED DATE</th>
            </tr>
          </thead>
          <tbody id="usersTable">
            <tr><td colspan="6" class="text-muted text-center py-4">Loading user accounts...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/admin/admin-components.js"></script>
<script>
requireAdminAuth();
renderAdminSidebar("accounts");

let allUsers = [];
let activeRoleFilter = "all";
let accSearchQuery = "";

function showAlert(msg, type = "success") {
  const box = document.getElementById("alertBox");
  box.className = `alert alert-${type} shadow-sm border-0 mb-3`;
  box.textContent = msg;
  box.classList.remove("d-none");
  setTimeout(() => box.classList.add("d-none"), 3000);
}

async function loadAccounts() {
  try {
    const data = await api("/admin/users");
    allUsers = data.users || [];
    renderUsersTable();
  } catch (err) {
    showAlert(err.message, "danger");
  }
}

function renderUsersTable() {
  const tbody = document.getElementById("usersTable");
  let filtered = allUsers;

  if (activeRoleFilter === "customer") {
    filtered = filtered.filter(u => !u.isAdmin);
  } else if (activeRoleFilter === "admin") {
    filtered = filtered.filter(u => u.isAdmin);
  }

  if (accSearchQuery.trim()) {
    const q = accSearchQuery.toLowerCase();
    filtered = filtered.filter(u => 
      (u.firstName && u.firstName.toLowerCase().includes(q)) || 
      (u.lastName && u.lastName.toLowerCase().includes(q)) || 
      (u.username && u.username.toLowerCase().includes(q)) ||
      (u.email && u.email.toLowerCase().includes(q))
    );
  }

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-5">No user accounts found matching filters.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered
    .map(
      (u) => `
    <tr>
      <td class="ps-4 fw-bold text-dark">
        <div>${u.firstName || ''} ${u.lastName || ''}</div>
      </td>
      <td><span class="badge bg-light text-dark border font-monospace">${u.username}</span></td>
      <td class="text-secondary">${u.email}</td>
      <td class="small text-muted" style="max-width:220px;">${u.homeAddress || "—"}</td>
      <td>
        ${u.isAdmin 
          ? '<span class="badge bg-warning text-dark rounded-pill px-3 py-1 fw-bold">ADMINISTRATOR</span>' 
          : '<span class="badge bg-secondary rounded-pill px-3 py-1">CUSTOMER</span>'}
      </td>
      <td class="pe-4 small text-muted">${new Date(u.createdAt).toLocaleDateString()}</td>
    </tr>`
    )
    .join("");
}

// Filter listeners
document.querySelectorAll(".role-filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".role-filter-btn").forEach(b => {
      b.classList.remove("active", "btn-dark");
      b.classList.add("btn-outline-dark");
    });
    btn.classList.add("active", "btn-dark");
    btn.classList.remove("btn-outline-dark");
    activeRoleFilter = btn.dataset.role;
    renderUsersTable();
  });
});

document.getElementById("accSearchInput").addEventListener("input", (e) => {
  accSearchQuery = e.target.value;
  renderUsersTable();
});

loadAccounts();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
