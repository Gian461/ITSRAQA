<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex min-vh-100">
  <div id="adminSidebar"></div>

  <div class="flex-grow-1 p-4 overflow-auto">
    <!-- Header Title Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1" style="color: var(--latk-maroon);">Dashboard Overview</h3>
        <p class="text-muted small mb-0">Live sales performance, metrics, and inventory alerts</p>
      </div>
      <a href="orders.html" class="btn btn-maroon btn-sm px-3 py-2">Manage Orders →</a>
    </div>

    <!-- Stat Metric Cards -->
    <div class="row g-3 mb-4" id="statCards">
      <!-- Injected by JS -->
    </div>

    <!-- Main Grid: Low Stock & Recent Orders -->
    <div class="row g-4">
      <!-- Low Stock Alerts -->
      <div class="col-lg-5">
        <div class="card stat-card p-4 h-100 shadow-sm border-0">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 text-dark d-flex align-items-center gap-2">
              <span>⚠️</span> Low Stock Alerts
            </h6>
            <a href="inventory.html" class="small text-decoration-none">Manage Catalog</a>
          </div>
          <div id="lowStockList" class="flex-grow-1">
            <p class="text-muted small">Loading low stock alerts...</p>
          </div>
        </div>
      </div>

      <!-- Recent Orders List -->
      <div class="col-lg-7">
        <div class="card stat-card p-4 h-100 shadow-sm border-0">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 text-dark d-flex align-items-center gap-2">
              <span>🧾</span> Recent Orders
            </h6>
            <a href="orders.html" class="small text-decoration-none">View All Orders</a>
          </div>
          <div id="recentOrders" class="flex-grow-1">
            <p class="text-muted small">Loading recent orders...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/admin/admin-components.js"></script>
<script>
requireAdminAuth();
renderAdminSidebar("dashboard");

async function loadDashboard() {
  try {
    const report = await api("/admin/reports");

    document.getElementById("statCards").innerHTML = `
      <div class="col-sm-6 col-lg-3">
        <div class="card stat-card p-3 shadow-sm border-0 border-start border-4 border-success">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="small text-muted fw-semibold">TOTAL REVENUE</span>
            <span class="fs-4">💰</span>
          </div>
          <div class="fs-3 fw-bold text-dark">${peso(report.totalRevenue)}</div>
          <div class="small text-success mt-1">Gross lifetime sales</div>
        </div>
      </div>

      <div class="col-sm-6 col-lg-3">
        <div class="card stat-card p-3 shadow-sm border-0 border-start border-4 border-primary">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="small text-muted fw-semibold">TOTAL ORDERS</span>
            <span class="fs-4">🧾</span>
          </div>
          <div class="fs-3 fw-bold text-dark">${report.totalOrders}</div>
          <div class="small text-muted mt-1">Placed across platform</div>
        </div>
      </div>

      <div class="col-sm-6 col-lg-3">
        <div class="card stat-card p-3 shadow-sm border-0 border-start border-4 border-info">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="small text-muted fw-semibold">CUSTOMERS</span>
            <span class="fs-4">👥</span>
          </div>
          <div class="fs-3 fw-bold text-dark">${report.totalCustomers}</div>
          <div class="small text-muted mt-1">Registered accounts</div>
        </div>
      </div>

      <div class="col-sm-6 col-lg-3">
        <div class="card stat-card p-3 shadow-sm border-0 border-start border-4 border-danger">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="small text-muted fw-semibold">LOW STOCK ITEMS</span>
            <span class="fs-4">⚠️</span>
          </div>
          <div class="fs-3 fw-bold text-danger">${report.lowStock.length}</div>
          <div class="small text-danger mt-1">Require re-stocking</div>
        </div>
      </div>`;

    document.getElementById("lowStockList").innerHTML = report.lowStock.length
      ? report.lowStock.map(p => `
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <div>
              <strong class="text-dark d-block mb-0" style="font-size:0.9rem;">${p.name}</strong>
              <span class="small text-muted">${p.subcategory || p.type}</span>
            </div>
            <span class="badge bg-danger rounded-pill px-3 py-1 fs-7">${p.stock} left</span>
          </div>`).join("")
      : `<p class="text-muted small my-3">All menu items are sufficiently stocked.</p>`;

    const { orders } = await api("/admin/orders");
    const recent = orders.slice(0, 6);

    document.getElementById("recentOrders").innerHTML = recent.length
      ? recent.map(o => `
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <div>
              <strong class="text-dark d-block mb-0" style="font-size:0.9rem;">#${o._id.slice(-6).toUpperCase()} — ${o.user ? (o.user.firstName || o.user.username) : 'Guest'}</strong>
              <span class="small text-muted">${new Date(o.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} • ${peso(o.total)}</span>
            </div>
            <span class="status-badge status-${o.status.replace(/\s/g,'-')}">${o.status}</span>
          </div>`).join("")
      : `<p class="text-muted small my-3">No orders recorded yet.</p>`;

  } catch (err) {
    console.error("Dashboard error:", err);
  }
}

loadDashboard();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
