<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders Management - LATK Admin</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex min-vh-100">
  <div id="adminSidebar"></div>

  <div class="flex-grow-1 p-4 overflow-auto">
    <!-- Header Title Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1" style="color: var(--latk-maroon);">Order Management</h3>
        <p class="text-muted small mb-0">Track, update, and manage customer orders in real-time</p>
      </div>
    </div>

    <div id="alertBox" class="alert d-none"></div>

    <!-- Filter Pill Bar -->
    <div class="card p-3 mb-4 border-0 shadow-sm rounded-4">
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <span class="small fw-bold text-muted me-2">FILTER BY STATUS:</span>
        <button class="btn btn-sm btn-dark rounded-pill px-3 filter-btn active" data-status="All">All Orders</button>
        <button class="btn btn-sm btn-outline-warning text-dark rounded-pill px-3 filter-btn" data-status="Pending">Pending</button>
        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 filter-btn" data-status="Preparing">Preparing</button>
        <button class="btn btn-sm btn-outline-primary rounded-pill px-3 filter-btn" data-status="Out for Delivery">Out for Delivery</button>
        <button class="btn btn-sm btn-outline-success rounded-pill px-3 filter-btn" data-status="Delivered">Delivered</button>
        <button class="btn btn-sm btn-outline-danger rounded-pill px-3 filter-btn" data-status="Cancelled">Cancelled</button>
      </div>
    </div>

    <!-- Orders Table Card -->
    <div class="card stat-card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th class="ps-4">ORDER ID</th>
              <th>CUSTOMER</th>
              <th>ITEMS</th>
              <th>TOTAL</th>
              <th>PAYMENT</th>
              <th>STATUS</th>
              <th class="pe-4">UPDATE STATUS</th>
            </tr>
          </thead>
          <tbody id="ordersTable">
            <tr><td colspan="7" class="text-muted text-center py-4">Loading customer orders...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/admin/admin-components.js"></script>
<script>
requireAdminAuth();
renderAdminSidebar("orders");

const STATUSES = ["Pending", "Preparing", "Out for Delivery", "Delivered", "Cancelled"];
let allOrders = [];
let activeFilter = "All";

function showAlert(msg, type = "success") {
  const box = document.getElementById("alertBox");
  box.className = `alert alert-${type} shadow-sm border-0 mb-3`;
  box.textContent = msg;
  box.classList.remove("d-none");
  setTimeout(() => box.classList.add("d-none"), 3000);
}

async function loadOrders() {
  try {
    const data = await api("/admin/orders");
    allOrders = data.orders || [];
    renderOrdersTable();
  } catch (err) {
    showAlert(err.message, "danger");
  }
}

function renderOrdersTable() {
  const tbody = document.getElementById("ordersTable");
  const filtered = activeFilter === "All" 
    ? allOrders 
    : allOrders.filter(o => o.status === activeFilter);

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-5">No orders found matching status "<strong>${activeFilter}</strong>".</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered
    .map(
      (o) => `
    <tr>
      <td class="ps-4 fw-bold">#${o._id.slice(-6).toUpperCase()}</td>
      <td>
        <div class="fw-semibold text-dark">${o.user ? o.user.firstName + " " + o.user.lastName : "Guest"}</div>
        <div class="small text-muted">${o.user ? o.user.email : ""}</div>
      </td>
      <td>
        <div class="small text-muted" style="max-width:240px;">
          ${o.items.map((i) => `<div>• <strong>${i.name}</strong> x${i.qty}</div>`).join("")}
        </div>
      </td>
      <td class="fw-bold text-dark">${peso(o.total)}</td>
      <td><span class="badge bg-light text-dark border">${o.paymentMethod}</span></td>
      <td><span class="status-badge status-${o.status.replace(/\s/g, "-")}">${o.status}</span></td>
      <td class="pe-4">
        <select class="form-select form-select-sm rounded-pill shadow-sm" style="min-width:140px;" onchange="updateStatus('${o._id}', this.value)">
          ${STATUSES.map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
        </select>
      </td>
    </tr>`
    )
    .join("");
}

async function updateStatus(id, status) {
  try {
    await api(`/admin/orders/${id}/status`, { method: "PATCH", body: { status } });
    showAlert(`Order #${id.slice(-6).toUpperCase()} status updated to "${status}".`);
    const target = allOrders.find(o => o._id === id);
    if (target) target.status = status;
    renderOrdersTable();
  } catch (err) {
    showAlert(err.message, "danger");
  }
}

// Filter listeners
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", (e) => {
    document.querySelectorAll(".filter-btn").forEach(b => {
      b.classList.remove("active", "btn-dark");
      b.classList.add("btn-outline-dark");
    });
    btn.classList.add("active", "btn-dark");
    btn.classList.remove("btn-outline-dark");
    activeFilter = btn.dataset.status;
    renderOrdersTable();
  });
});

loadOrders();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
