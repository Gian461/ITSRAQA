<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders - LATK Admin</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div class="admin-sidebar p-3" style="width:230px;">
    <div class="d-flex align-items-center gap-2 mb-4">
      <img src="/img/logo.svg" width="42" height="42" alt="LATK" />
      <strong>LATK Admin</strong>
    </div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="accounts.html">👥 Accounts</a>
    <a href="inventory.html">📦 Inventory</a>
    <a href="orders.html" class="active">🧾 Orders</a>
    <a href="reports.html">📈 Reports</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>

  <div class="flex-grow-1 p-4">
    <h3 class="fw-bold mb-4">Customer Orders</h3>
    <div id="alertBox" class="alert d-none"></div>
    <div class="card stat-card p-3">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr><th>Order #</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th></tr>
        </thead>
        <tbody id="ordersTable"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
requireAdminAuth();
const STATUSES = ["Pending", "Preparing", "Out for Delivery", "Delivered", "Cancelled"];

function showAlert(msg, type = "success") {
  const box = document.getElementById("alertBox");
  box.className = `alert alert-${type}`;
  box.textContent = msg;
  setTimeout(() => box.classList.add("d-none"), 3000);
}

async function loadOrders() {
  const { orders } = await api("/admin/orders");
  document.getElementById("ordersTable").innerHTML = orders
    .map(
      (o) => `
    <tr>
      <td>#${o._id.slice(-6).toUpperCase()}</td>
      <td>${o.user ? o.user.firstName + " " + o.user.lastName : "-"}</td>
      <td>${o.items.map((i) => `${i.name} x${i.qty}`).join(", ")}</td>
      <td>${peso(o.total)}</td>
      <td>${o.paymentMethod}</td>
      <td><span class="status-badge status-${o.status.replace(/\s/g, "-")}">${o.status}</span></td>
      <td>
        <select class="form-select form-select-sm" onchange="updateStatus('${o._id}', this.value)">
          ${STATUSES.map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
        </select>
      </td>
    </tr>`
    )
    .join("");
}

async function updateStatus(id, status) {
  try {
    await api(`/admin/orders/${id}/status`, { method: "PATCH", body: { status } });
    showAlert("Order status updated.");
    loadOrders();
  } catch (err) {
    showAlert(err.message, "danger");
  }
}

loadOrders();
</script>
</body>
</html>
