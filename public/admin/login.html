<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(160deg, var(--latk-maroon) 0%, var(--latk-maroon-dark) 100%); min-height: 100vh;">

<div class="d-flex align-items-center justify-content-center px-3" style="min-height: 100vh;">
  <div class="card p-4 p-md-5 shadow-lg border-0" style="width: 100%; max-width: 440px; border-radius: 24px; background: #ffffff;">
    <div class="text-center mb-4">
      <img src="/img/logo.svg" width="90" height="90" alt="LATK Badge" class="mb-2" />
      <h3 class="fw-bold mb-1" style="color: var(--latk-maroon);">LATK Admin Panel</h3>
      <p class="text-muted small mb-0">Sign in to manage cafe inventory & orders</p>
    </div>

    <div id="errorBox" class="alert alert-danger d-none"></div>

    <form id="adminLoginForm">
      <div class="mb-3 text-start">
        <label class="form-label-pill">ADMIN USERNAME</label>
        <input type="text" id="username" class="form-control form-control-latk-pill" required autocomplete="username" />
      </div>

      <div class="mb-4 text-start">
        <label class="form-label-pill">PASSWORD</label>
        <input type="password" id="password" class="form-control form-control-latk-pill" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-maroon w-100 py-3 fs-6 shadow-sm">LOGIN AS ADMIN</button>
    </form>

    <div class="text-center mt-4">
      <a href="/login.html" class="small text-muted text-decoration-underline">Back to customer login</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("d-none");
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      },
    });
    if (!data.user.isAdmin) {
      errorBox.textContent = "This account does not have admin privileges.";
      errorBox.classList.remove("d-none");
      return;
    }
    saveSession(data.token, data.user);
    window.location.href = "/admin/dashboard.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  }
});
</script>
</body>
</html>
