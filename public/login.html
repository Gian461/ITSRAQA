<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in to Order - LATK Cafe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-5 auth-side">
      <img src="img/logo.svg" width="130" height="130" alt="LATK Logo" class="mb-3" />
      <h2 class="fw-bold">Lolo And The Kid</h2>
    </div>
    <div class="col-md-7 d-flex align-items-center">
      <div class="w-75 mx-auto py-5">
        <h1 class="fw-bold">Sign in to Order</h1>
        <p class="text-muted">Good to see you back. Let's get you fed.</p>

        <div id="errorBox" class="alert alert-danger d-none"></div>

        <form id="loginForm" class="mt-4">
          <label class="form-label fw-bold small">USERNAME</label>
          <input type="text" id="username" class="form-control form-control-latk mb-3" required />

          <label class="form-label fw-bold small">PASSWORD</label>
          <input type="password" id="password" class="form-control form-control-latk mb-3" required />

          <button type="submit" class="btn btn-maroon w-100 py-2 mt-2">LOGIN</button>
        </form>

        <div class="text-center mt-3">
          <a href="#" class="text-decoration-underline small text-muted">forgot password?</a>
        </div>

        <hr class="my-4" />
        <div class="text-center">
          <p class="text-muted small mb-3">no account yet?</p>
          <a href="register.html" class="btn btn-outline-secondary rounded-pill px-4">Create An Account</a>
        </div>

        <div class="text-center mt-4">
          <a href="/admin/login.html" class="small text-muted">Admin login</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("d-none");
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      },
    });
    saveSession(data.token, data.user);
    window.location.href = data.user.isAdmin ? "/admin/dashboard.html" : "/home.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  }
});
</script>
</body>
</html>
