<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in to Order - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-split-wrapper">
  <!-- Left Gradient Panel -->
  <div class="auth-split-left col-md-5">
    <img src="img/logo.svg" width="140" height="140" alt="LATK Badge" class="mb-4" />
    <h2 class="fw-bold fs-2 mb-0 text-white">Lolo And The Kid</h2>
  </div>

  <!-- Right Form Panel -->
  <div class="auth-split-right col-md-7">
    <div class="auth-card-body">
      <h1 class="fw-bold display-6 mb-1">Sign in to Order</h1>
      <p class="text-secondary mb-4 small">Good to see you back. Let's get you fed.</p>

      <div id="errorBox" class="alert alert-danger d-none"></div>

      <form id="loginForm" class="mt-4">
        <div class="mb-3 text-start">
          <label class="form-label-pill">USERNAME</label>
          <input type="text" id="username" class="form-control form-control-latk-pill" required autocomplete="username" />
        </div>

        <div class="mb-3 text-start">
          <label class="form-label-pill">PASSWORD</label>
          <input type="password" id="password" class="form-control form-control-latk-pill" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-maroon w-100 py-3 mt-2 fs-6">LOGIN</button>
      </form>

      <div class="text-center mt-3">
        <a href="forgot-password.html" class="small text-muted text-decoration-underline">forgot password?</a>
      </div>

      <div class="position-relative text-center my-4">
        <hr class="text-muted opacity-25" />
        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">no account yet?</span>
      </div>

      <div class="text-center">
        <a href="register.html" class="btn btn-outline-latk w-100 py-2">Create An Account</a>
      </div>

      <div class="text-center mt-4">
        <a href="/admin/login.html" class="small text-muted">Admin login</a>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("d-none");
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      },
    });
    saveSession(data.token, data.user);
    window.location.href = data.user.isAdmin ? "/admin/dashboard.html" : "/home.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  }
});
</script>
</body>
</html>
