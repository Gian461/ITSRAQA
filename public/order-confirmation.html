<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmed - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div id="navbar"></div>

<div class="container my-5 flex-grow-1" style="max-width:720px;">
  <!-- Celebration Banner -->
  <div class="text-center mb-4">
    <div class="mx-auto mb-3 rounded-circle d-flex align-items-center justify-content-center bg-success text-white shadow-sm" style="width:80px;height:80px;font-size:2.5rem;">
      ✓
    </div>
    <h2 class="fw-bold mb-2" style="color: var(--latk-maroon);">Order Confirmed!</h2>
    <p class="text-secondary leading-relaxed max-w-md mx-auto">
      Thank you for ordering with <strong>Lolo And The Kid Cafe</strong>. Your food order is being prepared and will be delivered shortly!
    </p>
  </div>

  <div id="orderCard">
    <div class="card p-4 shadow-sm border-0 rounded-4 text-center text-muted">
      <div class="spinner-border spinner-border-sm text-primary mx-auto mb-2"></div>
      Fetching order details...
    </div>
  </div>

  <div class="text-center mt-4 d-flex justify-content-center gap-3">
    <a href="menu.html" class="btn btn-outline-latk px-4 py-2">Order More Items</a>
    <a href="order-status.html" class="btn btn-maroon px-4 py-2 shadow-sm">Track My Orders →</a>
  </div>
</div>

<div id="footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script>
requireAuth();
renderNavbar("orders");
renderFooter();

const params = new URLSearchParams(window.location.search);
const orderId = params.get("id");

async function loadOrder() {
  if (!orderId) {
    document.getElementById("orderCard").innerHTML = `<div class="alert alert-warning border-0 shadow-sm text-center">No order reference ID found.</div>`;
    return;
  }

  try {
    const { order } = await api(`/orders/${orderId}`);
    const el = document.getElementById("orderCard");
    const addr = order.deliveryAddress;

    el.innerHTML = `
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom">
          <div>
            <strong class="fs-5 text-dark">Order #${order._id.slice(-6).toUpperCase()}</strong>
            <span class="small text-muted d-block">${new Date(order.createdAt).toLocaleString()}</span>
          </div>
          <span class="status-badge status-${order.status.replace(/\s/g, "-")} px-3 py-1 fs-7">${order.status}</span>
        </div>

        <h6 class="fw-bold text-dark mb-2">Ordered Items</h6>
        <div class="mb-3">
          ${order.items.map((i) => `
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-light">
              <span class="text-dark"><strong>${i.name}</strong> <span class="text-muted small">x${i.qty}</span></span>
              <span class="fw-semibold">${peso(i.price * i.qty)}</span>
            </div>
          `).join("")}
        </div>

        <div class="bg-light p-3 rounded-3 mb-3">
          <div class="d-flex justify-content-between small text-muted mb-1">
            <span>Subtotal</span>
            <span>${peso(order.subtotal)}</span>
          </div>
          <div class="d-flex justify-content-between small text-muted mb-2">
            <span>Delivery Fee</span>
            <span>${peso(order.deliveryFee)}</span>
          </div>
          <hr class="my-2" />
          <div class="d-flex justify-content-between fw-bold fs-5 text-dark">
            <span>Total Paid</span>
            <span style="color:var(--latk-orange);">${peso(order.total)}</span>
          </div>
        </div>

        <div class="small text-muted border-top pt-3">
          <div class="mb-1">💳 <strong>Payment Method:</strong> <span class="badge bg-light text-dark border">${order.paymentMethod}</span></div>
          <div>📍 <strong>Delivery Address:</strong> ${addr.firstName} ${addr.lastName}, ${addr.address}, ${addr.barangay}, ${addr.city}${addr.landmark ? ` (${addr.landmark})` : ''}</div>
        </div>
      </div>
    `;
  } catch (err) {
    document.getElementById("orderCard").innerHTML = `<div class="alert alert-danger border-0 shadow-sm">${err.message}</div>`;
  }
}

loadOrder();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
