<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verification Code - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-split-wrapper">
  <!-- Left Gradient Panel -->
  <div class="auth-split-left col-md-5">
    <img src="img/logo.svg" width="140" height="140" alt="LATK Badge" class="mb-4" />
    <h2 class="fw-bold fs-2 mb-0 text-white">Lolo And The Kid</h2>
  </div>

  <!-- Right Form Panel -->
  <div class="auth-split-right col-md-7">
    <div class="auth-card-body">
      <h1 class="fw-bold display-6 mb-2">Forgot Password</h1>
      <p class="text-secondary mb-4 small">Enter the verification code sent to your email.</p>

      <div id="alertBox" class="alert d-none"></div>

      <form id="verifyForm" class="mt-4">
        <div class="mb-4">
          <label class="form-label-pill text-center d-block">ENTER VERIFICATION CODE</label>
          <input type="text" id="code" class="form-control form-control-latk-pill text-center fs-4 fw-bold" maxlength="6" placeholder="0 0 0 0 0 0" required />
        </div>

        <button type="submit" class="btn btn-maroon w-100 py-3 fs-6">CONFIRM</button>
      </form>

      <div class="text-center mt-4">
        <a href="forgot-password.html" class="small text-muted text-decoration-underline">Resend code</a>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("verifyForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("alertBox");
  alertBox.className = "alert alert-success";
  alertBox.textContent = "Verification code confirmed! Redirecting to login...";
  alertBox.classList.remove("d-none");
  setTimeout(() => {
    window.location.href = "login.html";
  }, 1500);
});
</script>
</body>
</html>
