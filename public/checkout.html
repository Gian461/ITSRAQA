<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout - LATK Cafe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-latk px-4">
  <a class="navbar-brand" href="home.html"><img src="img/logo.svg" width="42" height="42" alt="LATK" /></a>
  <div class="ms-auto">
    <span class="text-white">User: <strong id="navUserName"></strong></span>
  </div>
</nav>

<div class="container my-5">
  <div id="errorBox" class="alert alert-danger d-none"></div>
  <div class="row g-4">
    <div class="col-md-7">
      <h5 class="fw-bold mb-3">Delivery Address</h5>
      <div class="row g-2 mb-2">
        <div class="col-md-6"><input class="form-control form-control-latk" id="firstName" placeholder="First Name" required /></div>
        <div class="col-md-6"><input class="form-control form-control-latk" id="lastName" placeholder="Last Name" required /></div>
      </div>
      <input class="form-control form-control-latk mb-2" id="address" placeholder="Address" required />
      <div class="row g-2 mb-2">
        <div class="col-md-6"><input class="form-control form-control-latk" id="barangay" placeholder="Barangay" required /></div>
        <div class="col-md-6"><input class="form-control form-control-latk" id="city" placeholder="City" required /></div>
      </div>
      <input class="form-control form-control-latk mb-4" id="landmark" placeholder="Landmark (Optional)" />

      <hr />
      <h5 class="fw-bold mb-3">Payment Method</h5>
      <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="paymentMethod" id="qrph" value="QRPH" checked>
        <label class="form-check-label" for="qrph">QRPH</label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="paymentMethod" id="card" value="Credit or Debit Card">
        <label class="form-check-label" for="card">Credit or Debit Card</label>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="radio" name="paymentMethod" id="cod" value="Cash on Delivery">
        <label class="form-check-label" for="cod">Cash on Delivery</label>
      </div>
    </div>

    <div class="col-md-5">
      <div class="card p-4 shadow-sm" style="background:var(--latk-orange); color:#fff;">
        <h5 class="fw-bold mb-3">Order Summary</h5>
        <div id="orderItems"></div>
        <hr />
        <div class="d-flex justify-content-between"><span>Subtotal</span><span id="sSubtotal">₱0.00</span></div>
        <div class="d-flex justify-content-between"><span>Standard Delivery</span><span id="sDelivery">₱49.00</span></div>
        <div class="d-flex justify-content-between"><span>Discount</span><span id="sDiscount">-₱0.00</span></div>
        <div class="d-flex justify-content-between fw-bold fs-5 mt-2"><span>Total</span><span id="sTotal">₱0.00</span></div>
        <button class="btn btn-maroon w-100 mt-4 py-2" id="confirmBtn">Confirm Order</button>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
requireAuth();
const user = getUser();
if (user) document.getElementById("navUserName").textContent = user.firstName || user.username;

const DELIVERY_FEE = 49;
const cart = getCart();
if (!cart.length) window.location.href = "menu.html";

function renderSummary() {
  const container = document.getElementById("orderItems");
  container.innerHTML = cart
    .map(
      (i) => `
    <div class="d-flex justify-content-between mb-1">
      <span>${i.name} x${i.qty}</span>
      <span>${peso(i.price * i.qty)}</span>
    </div>`
    )
    .join("");
  const subtotal = cartSubtotal();
  document.getElementById("sSubtotal").textContent = peso(subtotal);
  document.getElementById("sDelivery").textContent = peso(DELIVERY_FEE);
  document.getElementById("sTotal").textContent = peso(subtotal + DELIVERY_FEE);
}
renderSummary();

document.getElementById("confirmBtn").addEventListener("click", async () => {
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("d-none");

  const deliveryAddress = {
    firstName: document.getElementById("firstName").value.trim(),
    lastName: document.getElementById("lastName").value.trim(),
    address: document.getElementById("address").value.trim(),
    barangay: document.getElementById("barangay").value.trim(),
    city: document.getElementById("city").value.trim(),
    landmark: document.getElementById("landmark").value.trim(),
  };
  const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

  if (!deliveryAddress.firstName || !deliveryAddress.lastName || !deliveryAddress.address || !deliveryAddress.barangay || !deliveryAddress.city) {
    errorBox.textContent = "Please complete all required delivery address fields.";
    errorBox.classList.remove("d-none");
    return;
  }

  try {
    const data = await api("/orders", {
      method: "POST",
      body: {
        items: cart.map((i) => ({ productId: i.productId, qty: i.qty })),
        deliveryAddress,
        paymentMethod,
      },
    });
    clearCart();
    window.location.href = `order-confirmation.html?id=${data.order._id}`;
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  }
});
</script>
</body>
</html>
