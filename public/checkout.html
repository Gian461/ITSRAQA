<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div id="navbar"></div>

<div class="container my-5 flex-grow-1" style="max-width:1140px;">
  <!-- Header Title -->
  <div class="mb-4">
    <h2 class="fw-bold mb-1" style="color: var(--latk-maroon);">Checkout</h2>
    <p class="text-secondary small">Review your order details and delivery address below</p>
  </div>

  <div id="errorBox" class="alert alert-danger shadow-sm border-0 d-none"></div>

  <div class="row g-4">
    <!-- Left Column: Delivery & Payment Details -->
    <div class="col-lg-7">
      <div class="card p-4 border-0 shadow-sm rounded-4 mb-4">
        <h5 class="fw-bold mb-3 d-flex align-items-center gap-2" style="color: var(--latk-maroon);">
          <span>📍</span> Delivery Address
        </h5>
        
        <form id="checkoutForm">
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label-pill">FIRST NAME</label>
              <input class="form-control form-control-latk" id="firstName" placeholder="First Name" required />
            </div>
            <div class="col-md-6">
              <label class="form-label-pill">LAST NAME</label>
              <input class="form-control form-control-latk" id="lastName" placeholder="Last Name" required />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label-pill">STREET ADDRESS</label>
            <input class="form-control form-control-latk" id="address" placeholder="House/Unit No., Street, Building" required />
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label-pill">BARANGAY</label>
              <input class="form-control form-control-latk" id="barangay" placeholder="Barangay" required />
            </div>
            <div class="col-md-6">
              <label class="form-label-pill">CITY / MUNICIPALITY</label>
              <input class="form-control form-control-latk" id="city" placeholder="City" required />
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label-pill">LANDMARK (OPTIONAL)</label>
            <input class="form-control form-control-latk" id="landmark" placeholder="e.g. Near Brgy. Hall / Gate Color" />
          </div>
        </form>
      </div>

      <!-- Payment Method Selection -->
      <div class="card p-4 border-0 shadow-sm rounded-4">
        <h5 class="fw-bold mb-3 d-flex align-items-center gap-2" style="color: var(--latk-maroon);">
          <span>💳</span> Payment Method
        </h5>

        <div class="d-flex flex-column gap-2" id="paymentOptions">
          <label class="border rounded-3 p-3 d-flex align-items-center justify-content-between cursor-pointer bg-white shadow-sm hover-border">
            <div class="d-flex align-items-center gap-3">
              <input class="form-check-input mt-0" type="radio" name="paymentMethod" id="qrph" value="QRPH" checked />
              <div>
                <strong class="d-block text-dark">QRPH Scan & Pay</strong>
                <span class="small text-muted">GCash, Maya, ShopeePay, Bank Apps</span>
              </div>
            </div>
            <span class="fs-4">📲</span>
          </label>

          <label class="border rounded-3 p-3 d-flex align-items-center justify-content-between cursor-pointer bg-white shadow-sm hover-border">
            <div class="d-flex align-items-center gap-3">
              <input class="form-check-input mt-0" type="radio" name="paymentMethod" id="card" value="Credit or Debit Card" />
              <div>
                <strong class="d-block text-dark">Credit / Debit Card</strong>
                <span class="small text-muted">Visa, Mastercard, JCB</span>
              </div>
            </div>
            <span class="fs-4">💳</span>
          </label>

          <label class="border rounded-3 p-3 d-flex align-items-center justify-content-between cursor-pointer bg-white shadow-sm hover-border">
            <div class="d-flex align-items-center gap-3">
              <input class="form-check-input mt-0" type="radio" name="paymentMethod" id="cod" value="Cash on Delivery" />
              <div>
                <strong class="d-block text-dark">Cash on Delivery</strong>
                <span class="small text-muted">Pay exact cash upon arrival</span>
              </div>
            </div>
            <span class="fs-4">💵</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Right Column: Order Summary Card -->
    <div class="col-lg-5">
      <div class="card p-4 shadow-lg border-0 rounded-4 text-white" style="background: var(--latk-maroon);">
        <h5 class="fw-bold mb-3 d-flex align-items-center gap-2 text-white">
          <span>🧾</span> Order Summary
        </h5>
        
        <div id="orderItems" class="flex-grow-1 mb-3 pe-1 overflow-auto" style="max-height: 280px;">
          <!-- Injected by JS -->
        </div>

        <hr class="border-light opacity-25 my-3" />

        <div class="d-flex justify-content-between mb-2">
          <span style="color: #f2d9c9;">Subtotal</span>
          <span id="sSubtotal" class="fw-semibold text-white">₱0.00</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span style="color: #f2d9c9;">Standard Delivery</span>
          <span id="sDelivery" class="fw-semibold text-white">₱49.00</span>
        </div>
        <div class="d-flex justify-content-between mb-3">
          <span style="color: #f2d9c9;">Discount</span>
          <span id="sDiscount" class="fw-semibold" style="color: #81c784;">-₱0.00</span>
        </div>

        <hr class="border-light opacity-25 my-3" />

        <div class="d-flex justify-content-between align-items-center">
          <span class="fw-bold fs-5 text-white">Total Pay</span>
          <span id="sTotal" class="fw-bold fs-3" style="color: var(--latk-gold);">₱0.00</span>
        </div>

        <button class="btn btn-orange w-100 mt-4 py-3 fs-6 shadow fw-bold" id="confirmBtn">
          Confirm & Place Order →
        </button>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script>
requireAuth();
renderNavbar("checkout");
renderFooter();

const user = getUser();
if (user) {
  if (user.firstName) document.getElementById("firstName").value = user.firstName;
  if (user.lastName) document.getElementById("lastName").value = user.lastName;
  if (user.homeAddress) document.getElementById("address").value = user.homeAddress;
}

const DELIVERY_FEE = 49;
const cart = getCart();
if (!cart.length) window.location.href = "menu.html";

function renderSummary() {
  const container = document.getElementById("orderItems");
  container.innerHTML = cart
    .map(
      (i) => `
    <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom border-light border-opacity-10">
      <div>
        <strong class="d-block text-white" style="font-size:0.95rem;">${i.name}</strong>
        <span class="small" style="color: #f2d9c9;">Qty: ${i.qty} × ${peso(i.price)}</span>
      </div>
      <strong class="text-white">${peso(i.price * i.qty)}</strong>
    </div>`
    )
    .join("");

  const subtotal = cartSubtotal();
  document.getElementById("sSubtotal").textContent = peso(subtotal);
  document.getElementById("sDelivery").textContent = peso(DELIVERY_FEE);
  document.getElementById("sTotal").textContent = peso(subtotal + DELIVERY_FEE);
}
renderSummary();

document.getElementById("confirmBtn").addEventListener("click", async () => {
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("d-none");
  const confirmBtn = document.getElementById("confirmBtn");

  const deliveryAddress = {
    firstName: document.getElementById("firstName").value.trim(),
    lastName: document.getElementById("lastName").value.trim(),
    address: document.getElementById("address").value.trim(),
    barangay: document.getElementById("barangay").value.trim(),
    city: document.getElementById("city").value.trim(),
    landmark: document.getElementById("landmark").value.trim(),
  };

  const selectedPayment = document.querySelector('input[name="paymentMethod"]:checked');
  const paymentMethod = selectedPayment ? selectedPayment.value : "QRPH";

  if (!deliveryAddress.firstName || !deliveryAddress.lastName || !deliveryAddress.address || !deliveryAddress.barangay || !deliveryAddress.city) {
    errorBox.textContent = "Please complete all required delivery address fields.";
    errorBox.classList.remove("d-none");
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  confirmBtn.disabled = true;
  confirmBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Processing Order...`;

  try {
    const data = await api("/orders", {
      method: "POST",
      body: {
        items: cart.map((i) => ({ productId: i.productId, qty: i.qty })),
        deliveryAddress,
        paymentMethod,
      },
    });
    clearCart();
    window.location.href = `order-confirmation.html?id=${data.order._id}`;
  } catch (err) {
    confirmBtn.disabled = false;
    confirmBtn.innerHTML = `Confirm & Place Order →`;
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
