<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account - LATK Cafe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-5 auth-side">
      <img src="img/logo.svg" width="130" height="130" alt="LATK Logo" class="mb-3" />
      <h2 class="fw-bold">Lolo And The Kid</h2>
    </div>
    <div class="col-md-7 py-5">
      <div class="w-75 mx-auto">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h1 class="fw-bold">Create Account</h1>
            <p class="text-muted">Welcome to LATK!</p>
          </div>
          <a href="login.html" class="btn btn-maroon">Back To Login</a>
        </div>

        <div id="errorBox" class="alert alert-danger d-none"></div>

        <form id="registerForm" class="mt-3">
          <label class="form-label fw-bold small">LASTNAME</label>
          <input type="text" id="lastName" class="form-control form-control-latk mb-3" required />

          <label class="form-label fw-bold small">FIRSTNAME</label>
          <input type="text" id="firstName" class="form-control form-control-latk mb-3" required />

          <label class="form-label fw-bold small">EMAIL ADDRESS</label>
          <input type="email" id="email" class="form-control form-control-latk mb-3" required />

          <label class="form-label fw-bold small">CREATED USERNAME</label>
          <input type="text" id="username" class="form-control form-control-latk mb-3" required />

          <label class="form-label fw-bold small">HOME ADDRESS</label>
          <input type="text" id="homeAddress" class="form-control form-control-latk mb-3" />

          <label class="form-label fw-bold small">PASSWORD</label>
          <input type="password" id="password" class="form-control form-control-latk mb-3" required minlength="6" />

          <label class="form-label fw-bold small">CONFIRM PASSWORD</label>
          <input type="password" id="confirmPassword" class="form-control form-control-latk mb-4" required minlength="6" />

          <div class="text-center">
            <button type="submit" class="btn btn-maroon px-5 py-2">CREATE ACCOUNT</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("d-none");

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  if (password !== confirmPassword) {
    errorBox.textContent = "Passwords do not match.";
    errorBox.classList.remove("d-none");
    return;
  }

  try {
    const data = await api("/auth/register", {
      method: "POST",
      body: {
        lastName: document.getElementById("lastName").value.trim(),
        firstName: document.getElementById("firstName").value.trim(),
        email: document.getElementById("email").value.trim(),
        username: document.getElementById("username").value.trim(),
        homeAddress: document.getElementById("homeAddress").value.trim(),
        password,
        confirmPassword,
      },
    });
    saveSession(data.token, data.user);
    window.location.href = "/home.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  }
});
</script>
</body>
</html>
