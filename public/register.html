<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account - LATK Cafe</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-split-wrapper">
  <!-- Left Gradient Panel -->
  <div class="auth-split-left col-md-5">
    <img src="img/logo.svg" width="140" height="140" alt="LATK Badge" class="mb-4" />
    <h2 class="fw-bold fs-2 mb-0 text-white">Lolo And The Kid</h2>
  </div>

  <!-- Right Form Panel -->
  <div class="auth-split-right col-md-7">
    <a href="login.html" class="btn btn-maroon btn-sm position-absolute top-0 end-0 m-4 px-3 py-1" style="font-size:0.8rem;">Back To Login</a>

    <div class="auth-card-body" style="max-width: 520px;">
      <h1 class="fw-bold display-6 mb-1">Create Account</h1>
      <p class="text-secondary mb-4 small">Welcome to LATK!</p>

      <div id="errorBox" class="alert alert-danger d-none"></div>

      <form id="registerForm">
        <div class="row g-2 mb-2 text-start">
          <div class="col-md-6">
            <label class="form-label-pill">LASTNAME</label>
            <input type="text" id="lastName" class="form-control form-control-latk-pill" required />
          </div>
          <div class="col-md-6">
            <label class="form-label-pill">FIRSTNAME</label>
            <input type="text" id="firstName" class="form-control form-control-latk-pill" required />
          </div>
        </div>

        <div class="mb-2 text-start">
          <label class="form-label-pill">EMAIL ADDRESS</label>
          <input type="email" id="email" class="form-control form-control-latk-pill" required />
        </div>

        <div class="mb-2 text-start">
          <label class="form-label-pill">CREATED USERNAME</label>
          <input type="text" id="username" class="form-control form-control-latk-pill" required />
        </div>

        <div class="mb-2 text-start">
          <label class="form-label-pill">HOME ADDRESS</label>
          <input type="text" id="homeAddress" class="form-control form-control-latk-pill" placeholder="Street, Barangay, City" />
        </div>

        <div class="mb-2 text-start">
          <label class="form-label-pill">PASSWORD</label>
          <input type="password" id="password" class="form-control form-control-latk-pill" required autocomplete="new-password" />
        </div>

        <div class="mb-3 text-start">
          <label class="form-label-pill">CONFIRM PASSWORD</label>
          <input type="password" id="confirmPassword" class="form-control form-control-latk-pill" required autocomplete="new-password" />
        </div>

        <button type="submit" class="btn btn-maroon w-100 py-3 mt-2 fs-6">CREATE ACCOUNT</button>
      </form>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.add("d-none");

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    errorBox.textContent = "Passwords do not match.";
    errorBox.classList.remove("d-none");
    return;
  }

  try {
    const data = await api("/auth/register", {
      method: "POST",
      body: {
        lastName: document.getElementById("lastName").value.trim(),
        firstName: document.getElementById("firstName").value.trim(),
        email: document.getElementById("email").value.trim(),
        username: document.getElementById("username").value.trim(),
        homeAddress: document.getElementById("homeAddress").value.trim(),
        password,
        confirmPassword,
      },
    });
    saveSession(data.token, data.user);
    window.location.href = "/home.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove("d-none");
  }
});
</script>
</body>
</html>
